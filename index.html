<title>GymBro Lite</title>

<style>
/* Layout: single mobile column, sticky header, fixed bottom tab bar, rest timer docked above it */
:root{
  --bg:#eceff2; --surface:#ffffff; --surface-2:#f5f7f9; --ink:#15181c; --muted:#5b6570; --line:#d3d9df;
  --accent:#e2aa00; --accent-ink:#15181c; --accent-text:#8a6400; --done:#23824f; --done-soft:#e1f2e8; --danger:#b3261e;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111316; --surface:#1a1e23; --surface-2:#22272d; --ink:#eceff2; --muted:#9aa4ae; --line:#2c333a;
  --accent:#f2c230; --accent-ink:#15181c; --accent-text:#f2c230; --done:#52c487; --done-soft:#17301f; --danger:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111316; --surface:#1a1e23; --surface-2:#22272d; --ink:#eceff2; --muted:#9aa4ae; --line:#2c333a;
  --accent:#f2c230; --accent-ink:#15181c; --accent-text:#f2c230; --done:#52c487; --done-soft:#17301f; --danger:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 170px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,6vw,26px);letter-spacing:.02em;text-transform:uppercase;line-height:1;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:10px;height:22px;background:var(--accent);border-radius:2px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync b{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.cloud b{background:var(--done)}
h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.05;margin:8px 0 4px;text-wrap:balance;text-transform:uppercase;letter-spacing:.01em}
h2{font-family:var(--f-display);font-weight:600;font-size:21px;margin:0;line-height:1.15;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .v{font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:14px;color:var(--muted);font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.scheda-card .exl{color:var(--muted);font-size:13px;margin:6px 0 12px}
.meta{font-size:13px;color:var(--muted)}
.back{background:none;border:0;padding:6px 0;color:var(--muted);font-weight:600;display:inline-flex;gap:6px;align-items:center;min-height:40px}
/* session */
.ex{padding:0;overflow:hidden}
.ex-head{padding:14px 14px 10px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.tag{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.target{font-family:var(--f-display);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.hint{margin:0 14px 10px;font-size:13px;color:var(--muted)}
.hint .up{color:var(--accent-text);font-weight:700}
.sets{border-top:1px solid var(--line)}
.set{display:grid;grid-template-columns:28px 1fr 1fr 52px;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set .n{font-family:var(--f-display);font-weight:600;color:var(--muted);font-size:18px;text-align:center}
.field{position:relative}
.field input{width:100%;min-height:44px;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:8px 34px 8px 10px;font-family:var(--f-display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.field input.bad{border-color:var(--danger);color:var(--danger)}
.field span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.check{width:52px;height:44px;border-radius:9px;border:2px solid var(--line);background:transparent;display:grid;place-items:center}
.check svg{width:22px;height:22px}
.set.done{background:var(--done-soft)}
.coach{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.coach summary{font-weight:600;cursor:pointer}
.coach ul{margin:8px 0 2px;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.set.done .vals{grid-column:2 / 4;font-family:var(--f-display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.set.done .check{background:var(--done);border-color:var(--done);color:#fff}
.set.done .n{color:var(--done)}
.ex-foot{display:flex;justify-content:space-between;gap:8px;padding:8px 14px 12px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 16px}
.progress div{height:100%;background:var(--accent)}
/* editor */
.ed-item .ctrls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.ed-item label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.ed-item input,.ed-item select,.inp{min-height:42px;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:8px 10px;width:100%;font-variant-numeric:tabular-nums}
.reps{display:flex;align-items:center;gap:4px}
.reps input{text-align:center;padding:8px 4px}
.iconbtn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;font-size:16px;line-height:1}
.inp.title{font-family:var(--f-display);font-size:22px;font-weight:600}
/* picker */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(10,12,14,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--bg);width:100%;max-width:640px;max-height:88%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-in>*{flex-shrink:0}
.sheet-in>.plist{flex:1 1 auto;min-height:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none;flex-shrink:0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0;line-height:1.3;min-height:34px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.plist{overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-bottom:8px}
.pitem{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.pitem small{color:var(--muted)}
/* progress */
.chart{width:100%;height:auto;display:block}
.hist{display:flex;flex-direction:column}
.hist div{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist div:last-child{border-bottom:0}
.hist b{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.hist span{font-variant-numeric:tabular-nums;min-width:0}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:20px;margin-bottom:4px}
/* garmin */
.gcard{display:flex;flex-direction:column;gap:12px;margin-bottom:18px}
.gm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.gm .v{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.05;font-variant-numeric:tabular-nums}
.gm .v small{font-size:13px;color:var(--muted);font-weight:500}
.gm .d{font-size:12px;color:var(--muted)}
.gm .wide{grid-column:1 / -1}
.verdict{border-left:4px solid var(--accent);padding:2px 0 2px 10px}
.verdict b{font-family:var(--f-display);font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;display:block}
.verdict.high{border-color:var(--done)} .verdict.high b{color:var(--done)}
.verdict.mid b{color:var(--accent-text)}
.verdict.low{border-color:var(--danger)} .verdict.low b{color:var(--danger)}
.verdict p{margin:2px 0 0;font-size:14px}
.hist span small{color:var(--muted);font-size:12px}
/* corsa */
.runs{display:flex;flex-direction:column}
.run{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.run:last-child{border-bottom:0}
.run .main{font-family:var(--f-display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.run .main span{color:var(--muted);font-weight:500}
.src{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-text)}
.rform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rform label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.plan{padding:12px 0;border-bottom:1px solid var(--line)}
.plan:last-child{border-bottom:0;padding-bottom:0}
.plan h2{font-size:19px}
.pdesc{margin:6px 0 0;font-size:14px}
.steps{margin:8px 0 0;padding-left:20px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.pbox{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:15px}
.pbox .steps{color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;margin:6px 0 16px}
.seg button{border:0;background:transparent;border-radius:8px;min-height:38px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
/* timer + nav */
#timer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:20;padding:0 max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));pointer-events:none}
#timer .tb{max-width:616px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;pointer-events:auto;position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#timer .tt{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1;font-variant-numeric:tabular-nums;min-width:74px}
#timer .tl{font-size:12px;opacity:.75;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#timer button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:6px 8px;font-weight:600;font-size:13px;min-height:36px;white-space:nowrap}
#timer .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
#timer.full{inset:0;bottom:0;padding:0;display:flex;align-items:center;justify-content:center;background:rgba(10,12,14,.72);pointer-events:auto;z-index:30}
#timer .tcard{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:24px;padding:20px 20px 12px;width:min(340px,calc(100% - 32px));display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
#timer .tname{font-size:15px;color:var(--muted);text-align:center;max-width:100%;overflow-wrap:anywhere}
#timer .tname b{display:block;color:var(--ink);font-size:17px;margin-top:2px}
#timer .ring{position:relative;width:min(240px,62vw);aspect-ratio:1}
#timer .ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
#timer .rbg{fill:none;stroke:var(--line);stroke-width:14}
#timer .rfg{fill:none;stroke:var(--accent);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
#timer .rin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#timer .rtime{font-family:var(--f-display);font-weight:700;font-size:58px;line-height:1;font-variant-numeric:tabular-nums}
#timer .rskip{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:10px 28px;font-weight:700;font-size:17px;min-height:46px}
#timer .rbtns{display:flex;gap:10px;width:100%}
#timer .rb{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-weight:600;font-size:16px}
#timer .rmin{background:none;border:0;color:var(--muted);font-weight:600;font-size:14px;padding:6px 10px;min-height:36px}
#timer.full.over .rtime{color:var(--accent-text)}
@media (prefers-reduced-motion:reduce){#timer .rfg{transition:none}}
#timer.over .tb{background:var(--accent);color:var(--accent-ink)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-top:1px solid var(--line);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{background:none;border:0;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--ink)}
nav button.on svg{color:var(--accent-text)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.set.done{transition:background .25s}}
</style>
</head>

<div id="sheet"></div>

function writeDoc(id,body){
  lsSave();
  if(!COL) return;
  const col=COL;
  chains[id]=(chains[id]||Promise.resolve()).then(()=>col.doc(id).set(body)).catch(e=>{
    const c=e&&e.code;
    if(c==="quota_exceeded") toast("Spazio cloud pieno: i dati restano salvati sul telefono");
    else if(c==="unavailable") setTimeout(()=>writeDoc(id,body),1500+Math.random()*1500);
    else if(c==="invalid_argument"||c==="revoked"||c==="not_granted"){COL=null;mode="local";renderSync();}
  });
}

let cloudReady=false;

async function initCloud(){
  const ready=()=>{cloudReady=true;importOttobre();tryImportRuns();};
  if(!window.claude||!window.claude.use) return ready();
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  if(!db||!user) return ready();
  const uid=await user.id(); if(!uid) return ready();
  COL=db.collection("data/users/"+uid);
  let settled=false;
  const t=setTimeout(()=>{if(mode!=="cloud"){document.querySelector("#sync span").textContent="Cloud non raggiungibile";}},10000);
  COL.onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(t);mode="cloud";renderSync();}
    if(snap.empty){
      if(!snap.metadata.fromCache&&!settled){settled=true;
        if(!state.esempio) saveConfig();
        Object.keys(state.months).forEach(saveMonth);
        if(state.garmin&&Object.keys(state.garmin).length) saveGarmin();
        if((state.runs&&state.runs.length)||(state.runPlans&&state.runPlans.length)) saveRuns();
        ready();
      }
      return;
    }
    settled=true;
    const next={schede:state.schede,custom:state.custom,months:{},esempio:state.esempio,garmin:state.garmin||{},runs:state.runs||[],runsHidden:state.runsHidden||[],runPlans:state.runPlans||[],imports:state.imports||[],ver:state.ver};
    snap.docs.forEach(d=>{const b=clone(d.data()||{});
      if(d.id==="config"){next.schede=b.schede||[];next.custom=b.custom||[];next.imports=b.imports||[];next.esempio=false;}
      else if(d.id==="garmin") next.garmin=b.days||{};
      else if(d.id==="runs"){next.runs=b.list||[];next.runsHidden=b.hidden||[];next.runPlans=b.plans||[];}
      else if(d.id.startsWith("m-")) next.months[d.id]=b.sets||[];});
    state=next; lsSave(); softRender();
    if(!snap.metadata.fromCache&&!cloudReady) ready();
  },()=>{clearTimeout(t);COL=null;mode="local";renderSync();ready();});
}

/* ---------- Utilità ---------- */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:NaN};
const fmt=n=>(Math.round(n*100)/100).toString().replace(".",",");
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const monthKey=t=>"m-"+dayKey(t).slice(0,7);
const MESI=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const dShort=k=>{const [y,m,d]=k.split("-");return (+d)+" "+MESI[+m-1]};
const exInfo=id=>CATMAP[id]||(state.custom||[]).find(c=>c.id===id)||{id,n:id,g:"Altro",e:""};
const allSets=()=>Object.values(state.months).flat();
const uid=()=>Math.random().toString(36).slice(2,9);
const fmtTime=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const inc=ex=>{const e=exInfo(ex).e;return e==="Manubri"?2:(e==="Corpo libero"||e==="Cardio")?0:2.5};
const UNIT={rip:"rip",sec:"sec",min:"min"}, MARK={sec:"″",min:"′"};
const e1rm=(w,r)=>w*(1+r/30);

function setsByDay(ex){const m={};allSets().forEach(s=>{if(s.ex===ex){(m[dayKey(s.t)]||(m[dayKey(s.t)]=[])).push(s)}});Object.values(m).forEach(a=>a.sort((x,y)=>x.t-y.t));return m;}
function todaySets(ex){return (setsByDay(ex)[dayKey(Date.now())]||[]);}
function lastSession(ex){const m=setsByDay(ex),today=dayKey(Date.now());const k=Object.keys(m).filter(k=>k!==today).sort().pop();return k?{day:k,sets:m[k]}:null;}
function suggestion(item){
  const last=lastSession(item.ex); if(!last) return null;
  const W=Math.max(...last.sets.map(s=>s.w));
  const top=last.sets.filter(s=>s.w===W);
  const hit=last.sets.length>=item.serie&&top.every(s=>s.r>=item.rMax);
  return {last,W,up:hit,next:hit?W+inc(item.ex):W,bodyweight:inc(item.ex)===0};
}

function weekStats(){
  const since=Date.now()-7*864e5; const s=allSets().filter(x=>x.t>=since);
  return {giorni:new Set(s.map(x=>dayKey(x.t))).size,serie:s.length,vol:s.reduce((a,x)=>a+x.w*x.r,0)};
}
function lastDone(sid){const s=allSets().filter(x=>x.s===sid);if(!s.length)return null;return dayKey(Math.max(...s.map(x=>x.t)));}

function vSessione(){
  const s=state.schede.find(x=>x.id===sessId); if(!s){view="oggi";return vOggi();}
  let tot=0,done=0;
  const cards=s.esercizi.map((item,idx)=>{
    const U=item.u||"rip", timed=U!=="rip";
    const info=exInfo(item.ex), today=todaySets(item.ex), sg=timed?null:suggestion(item);
    const rows=Math.max(item.serie,today.length+(draft[item.ex+":extra"]||0));
    tot+=item.serie; done+=Math.min(today.length,item.serie);
    let hint=timed?(U==="min"?"Segna i minuti svolti.":"Esercizio a tempo: segna i secondi di lavoro."):"Prima volta: scegli un peso con cui completi le ripetizioni con 1–2 di margine.";
    if(sg){const lastTxt=`${dShort(sg.last.day)}: ${fmt(sg.W)} kg × ${sg.last.sets.map(x=>x.r).join(", ")}`;
      hint=sg.bodyweight?`Ultima ${lastTxt}${sg.up?' · <span class="up">aggiungi ripetizioni o zavorra</span>':""}`:
      sg.up?`Ultima ${lastTxt} · <span class="up">oggi prova ${fmt(sg.next)} kg ↑</span>`:`Ultima ${lastTxt} · oggi resta su ${fmt(sg.W)} kg`;}
    const defW=sg?sg.next:"";
    let html="";
    for(let i=0;i<rows;i++){
      const d=today[i];
      if(d){html+=`<div class="set done"><div class="n">${i+1}</div><div class="vals">${timed?d.r+" "+UNIT[U]:fmt(d.w)+" kg × "+d.r}</div>
        <button class="check" data-act="undo" data-ex="${item.ex}" data-t="${d.t}" aria-label="Annulla serie ${i+1}">${CHECK}</button></div>`;}
      else{const k=item.ex+":"+i, dv=draft[k]||{}, prevW=i>0&&today[i-1]?today[i-1].w:defW;

      <p class="hint">${hint}</p><div class="sets">${html}</div>

      ${!SENZA_TIMER&&item.rec>0?`<button class="btn sm ghost" data-act="timer" data-rec="${item.rec}" data-name="${esc(info.n)}">Avvia recupero</button>`:""}</div></div>`;
  }).join("");
  return `<button class="back" data-act="tab" data-v="oggi">‹ Schede</button>
  <div class="row between"><h1>${esc(s.nome)}</h1><span class="meta">${done}/${tot} serie</span></div>

function vProgPalestra(){
  const used=[...new Set(allSets().filter(s=>s.w>0).map(s=>s.ex))];
  if(!used.length) return `<div class="card empty"><strong>Ancora nessun dato</strong>Completa la prima serie da Allenamento: qui vedrai l'andamento dei pesi per ogni esercizio.</div>`;
  used.sort((a,b)=>exInfo(a).n.localeCompare(exInfo(b).n,"it"));
  if(!progEx||!used.includes(progEx)){const last=allSets().sort((a,b)=>b.t-a.t)[0];progEx=last.ex;}
  const m=setsByDay(progEx), days=Object.keys(m).sort();
  const pts=days.map(k=>({k,w:Math.max(...m[k].map(s=>s.w)),rm:Math.max(...m[k].map(s=>e1rm(s.w,s.r))),vol:m[k].reduce((a,s)=>a+s.w*s.r,0)}));
  const rec=Math.max(...pts.map(p=>p.w)), bestRm=Math.max(...pts.map(p=>p.rm));
  const first=pts[0].w, delta=pts[pts.length-1].w-first;
  return `
  <label class="label" for="pe">Esercizio</label>
  <select class="inp" id="pe" style="margin:6px 0 14px">${used.map(id=>`<option value="${id}" ${id===progEx?"selected":""}>${esc(exInfo(id).n)}</option>`).join("")}</select>
  <div class="stats"><div class="stat"><div class="label">Record</div><div class="v">${fmt(rec)}<small> kg</small></div></div>
  <div class="stat"><div class="label">Massimale st.</div><div class="v">${fmt(Math.round(bestRm*2)/2)}<small> kg</small></div></div>
  <div class="stat"><div class="label">Dall'inizio</div><div class="v">${delta>0?"+":""}${fmt(delta)}<small> kg</small></div></div></div>
  <div class="card" style="margin-bottom:12px"><div class="label">Peso massimo per seduta</div>${chart(pts)}</div>
  <div class="card"><div class="label" style="margin-bottom:4px">Storico</div><div class="hist">${days.slice().reverse().slice(0,15).map(k=>`<div><b>${dShort(k)}</b><span>${m[k].map(s=>fmt(s.w)+"×"+s.r).join(" · ")}${gLine(k)}</span></div>`).join("")}</div></div>
  <p class="meta">Il massimale stimato usa la formula di Epley sulla serie migliore.</p>`;
}
function chart(pts){
  const W=340,H=170,pl=36,pr=12,pt=14,pb=26;
  if(pts.length<2) return `<p class="meta" style="margin:10px 0 0">Il grafico appare dalla seconda seduta. Per ora: ${fmt(pts[0].w)} kg il ${dShort(pts[0].k)}.</p>`;
  let lo=Math.min(...pts.map(p=>p.w)),hi=Math.max(...pts.map(p=>p.w));
  if(hi===lo){lo-=5;hi+=5;} const pad=(hi-lo)*.15; lo=Math.max(0,lo-pad); hi+=pad;
  const x=i=>pl+(W-pl-pr)*i/(pts.length-1), y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  const ticks=[lo,(lo+hi)/2,hi];
  const path=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.w).toFixed(1)).join(" ");
  const area=path+` L${x(pts.length-1).toFixed(1)} ${H-pb} L${pl} ${H-pb} Z`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Andamento del peso massimo">
  ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${fmt(Math.round(t*2)/2)}</text>`).join("")}
  <path d="${area}" fill="var(--accent)" opacity=".15"/>
  <path d="${path}" fill="none" stroke="var(--accent-text)" stroke-width="2.5" stroke-linejoin="round"/>
  ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.w)}" r="${i===pts.length-1?4.5:3}" fill="${i===pts.length-1?"var(--accent)":"var(--surface)"}" stroke="var(--accent-text)" stroke-width="2"/>`).join("")}
  <text x="${pl}" y="${H-8}" font-size="10" fill="var(--muted)">${dShort(pts[0].k)}</text>
  <text x="${W-pr}" y="${H-8}" font-size="10" fill="var(--muted)" text-anchor="end">${dShort(pts[pts.length-1].k)}</text></svg>`;
}

function verdict(d){

const DENY=["needs_reauth","server_not_connected","blocked_by_policy","approval_required","not_in_manifest","selection_required","server_not_found"];

const SENZA_GARMIN=true, SENZA_TIMER=false;
async function initGarmin(){

    <label>Tipo<select class="inp" id="rf-tipo">${tipiForm().map(t=>`<option ${runPick&&planById(runPick)&&planById(runPick).nome===t?"selected":""}>${esc(t)}</option>`).join("")}</select></label>
    <label>Distanza (km)<input class="inp" id="rf-km" inputmode="decimal" placeholder="5,0"></label>
    <label>Durata<input class="inp" id="rf-t" inputmode="numeric" placeholder="mm:ss o h:mm:ss"></label>
    <label>FC media (facoltativa)<input class="inp" id="rf-hr" inputmode="numeric" placeholder="bpm"></label></div>
    <div class="row" style="margin-top:12px"><button class="btn primary grow" data-act="runsave">Salva corsa</button><button class="btn ghost" data-act="runcancel">Annulla</button></div></div>`:"";
  const src=acts.status==="ok"?"Le corse registrate con l'orologio arrivano da sole da Garmin.":acts.status==="error"?"Importazione da Garmin non disponibile al momento: puoi aggiungere le corse a mano.":"";
  const wk=runs.filter(r=>r.t>=weekStart(now).getTime()), kmWk=wk.reduce((s,r)=>s+r.km,0);
  const last=runs.slice().sort((a,b)=>b.t-a.t)[0];
  return `<h1>Corsa</h1><p class="sub">${src||"Scegli un allenamento, corri e salva l'uscita."}</p>
  ${form}${runForm?"":`<button class="btn primary block" data-act="runadd" style="margin-bottom:14px">+ Aggiungi corsa</button>`}
  ${runForm?"":vPiani()}
  ${runForm||!runs.length?"":`<div class="card row between"><div class="grow"><div class="label">Questa settimana</div>
    <div class="meta" style="margin-top:2px">${fmt(Math.round(kmWk*10)/10)} km in ${wk.length} ${wk.length===1?"uscita":"uscite"}${last?" · ultima il "+dShort(dayKey(last.t)):""}</div></div>
    <button class="btn sm" data-act="goprog-corsa">Vedi progressi</button></div>`}`;
}
function vProgCorsa(){
  const runs=(state.runs||[]).slice().sort((a,b)=>b.t-a.t), now=Date.now();
  if(!runs.length) return `<div class="card empty"><strong>Nessuna corsa ancora</strong>Le uscite che salvi nella sezione Corsa compaiono qui, con chilometri e passo.
    <div style="margin-top:12px"><button class="btn primary" data-act="tab" data-v="corsa">Vai a Corsa</button></div></div>`;
  const sumKm=a=>a.reduce((s,r)=>s+r.km,0), sumSec=a=>a.reduce((s,r)=>s+r.sec,0);
  const wk=runs.filter(r=>r.t>=weekStart(now).getTime()), mo=runs.filter(r=>dayKey(r.t).slice(0,7)===dayKey(now).slice(0,7));
  const l4=runs.filter(r=>r.t>=now-28*864e5);
  const weeks=[];for(let i=7;i>=0;i--){const s=weekStart(now);s.setDate(s.getDate()-7*i);const e=new Date(s);e.setDate(e.getDate()+7);weeks.push({s,km:sumKm(runs.filter(r=>r.t>=s.getTime()&&r.t<e.getTime()))});}
  return `<div class="stats"><div class="stat"><div class="label">Settimana</div><div class="v">${fmt(Math.round(sumKm(wk)*10)/10)}<small> km</small></div></div>
  <div class="stat"><div class="label">Mese</div><div class="v">${fmt(Math.round(sumKm(mo)*10)/10)}<small> km</small></div></div>
  <div class="stat"><div class="label">Passo 4 sett.</div><div class="v">${paceTxt(sumSec(l4),sumKm(l4))}<small> /km</small></div></div></div>
  <div class="card" style="margin-bottom:12px"><div class="label">Km per settimana</div>${weekChart(weeks)}</div>
  <div class="card"><div class="label" style="margin-bottom:2px">Uscite</div><div class="runs">${runs.slice(0,30).map(r=>`<div class="run"><div class="grow">
    <div class="main">${fmt(Math.round(r.km*100)/100)} km <span>· ${durTxt(r.sec)} · ${paceTxt(r.sec,r.km)}/km</span></div>
    <div class="meta">${dShort(dayKey(r.t))} · ${esc(r.tipo)}${r.hr?" · FC "+r.hr+(r.hrMax?"/"+r.hrMax:""):""}${r.te?" · effetto aerobico "+fmt(r.te):""}${r.g?' · <span class="src">Garmin</span>':""}</div></div>
    <button class="iconbtn" data-act="rundel" data-id="${r.id}" aria-label="Elimina corsa">${confirmDel===r.id?"?":"✕"}</button></div>`).join("")}</div>
    ${runs.some(r=>r.id===confirmDel)?'<p class="meta" style="margin:6px 0 0">Tocca di nuovo "?" per eliminare.</p>':""}</div>`;
}
let progTab="palestra";
function vProgressi(){
  const t=(v,l)=>`<button class="${progTab===v?"on":""}" data-act="ptab" data-v="${v}" role="tab" aria-selected="${progTab===v}">${l}</button>`;
  return `<h1>Progressi</h1><div class="seg" role="tablist">${t("palestra","Palestra")}${t("corsa","Corsa")}</div>${progTab==="corsa"?vProgCorsa():vProgPalestra()}`;
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]"); if(!b) return;
  if(b.dataset.act==="ptab"){progTab=b.dataset.v;confirmDel=null;render();}
  else if(b.dataset.act==="goprog-corsa"){progTab="corsa";go("progressi");}
});
function weekChart(weeks){
  const W=340,H=150,pl=8,pr=8,pt=18,pb=22,max=Math.max(1,...weeks.map(w=>w.km)),bw=(W-pl-pr)/weeks.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Chilometri per settimana, ultime 8 settimane">
  <line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>
  ${weeks.map((w,i)=>{const h=(H-pt-pb)*w.km/max,x=pl+i*bw+bw*.18,y=H-pb-h,last=i===weeks.length-1;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*.64).toFixed(1)}" height="${Math.max(h,w.km?2:0).toFixed(1)}" rx="3" fill="${last?"var(--accent)":"var(--accent-text)"}" opacity="${last?1:.55}"/>
    ${w.km?`<text x="${(x+bw*.32).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--ink)">${fmt(Math.round(w.km*10)/10)}</text>`:""}
    <text x="${(x+bw*.32).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${w.s.getDate()}/${w.s.getMonth()+1}</text>`;}).join("")}</svg>`;
}

/* ---------- Backup (Esporta / Importa) ---------- */
const LBK="gymbro-ultimo-backup";
let pendingImport=null;
function lastBackup(){try{return localStorage.getItem(LBK);}catch(e){return null;}}
function vBackup(){
  const lb=lastBackup(), nSerie=allSets().length, nCorse=(state.runs||[]).length;
  if(pendingImport){const d=pendingImport.dati, ns=Object.values(d.months||{}).flat().length;
    return `<div class="card" style="margin-top:18px"><h2>Ripristinare il backup?</h2>
    <p class="meta" style="margin:6px 0 12px">Backup del ${esc(pendingImport.quando)}: ${(d.schede||[]).length} schede, ${ns} serie, ${(d.runs||[]).length} corse. I dati attuali su questo telefono verranno sostituiti.</p>
    <div class="row"><button class="btn primary grow" data-act="bk-ok">Ripristina</button><button class="btn ghost" data-act="bk-no">Annulla</button></div></div>`;}
  return `<div class="card" style="margin-top:18px"><div class="label" style="margin-bottom:4px">Backup dei dati</div>
  <p class="meta" style="margin:0 0 12px">I dati sono salvati solo su questo telefono (${nSerie} serie, ${nCorse} corse). ${lb?"Ultimo backup: "+esc(lb)+".":"Nessun backup ancora fatto."} Salva una copia su iCloud Drive o Google Drive ogni tanto.</p>
  <div class="row"><button class="btn primary grow" data-act="bk-exp">Esporta backup</button><button class="btn grow" data-act="bk-imp">Importa</button></div>
  <input type="file" id="bk-file" accept="application/json,.json" hidden></div>`;
}
async function exportBackup(){
  const oggi=dayKey(Date.now()), name="gymbro-backup-"+oggi+".json";
  const blob=new Blob([JSON.stringify({app:"gymbro-lite",v:1,esportato:new Date().toISOString(),dati:state})],{type:"application/json"});
  const segna=()=>{try{localStorage.setItem(LBK,dShort(oggi)+" "+oggi.slice(0,4));}catch(e){} render();};
  try{const file=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Backup GymBro"});segna();toast("Backup salvato");return;}
  }catch(e){if(e&&e.name==="AbortError")return;}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);segna();toast("Backup scaricato: "+name);
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act;
  if(a==="bk-exp") exportBackup();
  else if(a==="bk-imp"){const f=document.getElementById("bk-file"); f&&f.click();}
  else if(a==="bk-no"){pendingImport=null;render();}
  else if(a==="bk-ok"&&pendingImport){state=pendingImport.dati;pendingImport=null;lsSave();render();toast("Backup ripristinato");}
});
document.addEventListener("change",e=>{
  const t=e.target; if(t.id!=="bk-file"||!t.files||!t.files[0]) return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
      if(!d||d.app!=="gymbro-lite"||!d.dati||!Array.isArray(d.dati.schede)) throw 0;
      d.dati.months=d.dati.months||{}; d.dati.custom=d.dati.custom||[];
      const q=new Date(d.esportato); pendingImport={dati:d.dati,quando:isNaN(q)?"data sconosciuta":dShort(dayKey(q))+" "+q.getFullYear()}; render();
    }catch(err){toast("Questo file non è un backup di GymBro");}};
  r.onerror=()=>toast("Non riesco a leggere il file");
  r.readAsText(t.files[0]);
});
/* App installabile: lavoro offline e dati persistenti */
if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}

/* ---------- Timer di recupero ---------- */
let tEnd=0,tTotal=0,tName="",tInt=null,tBeeped=false,AC=null,wake=null;
function ensureAudio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();}catch(e){}}
function beep(){if(!AC)return;try{[0,.3,.6].forEach((d,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=i===2?1320:880;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+d;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.start(t);o.stop(t+.25);});}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}}
let tFrom=null,tPause=null;
function startTimer(sec,name,from){tMini=false;tFrom=from||null;tPause=null;tTotal=sec;tEnd=Date.now()+sec*1000;tName=name;tBeeped=false;clearInterval(tInt);tInt=setInterval(tick,250);tick();}
function stopTimer(){clearInterval(tInt);tInt=null;tFrom=null;tPause=null;document.getElementById("timer").hidden=true;}
let tMini=false;
const RC=2*Math.PI*104;
function tick(){
  const el=document.getElementById("timer"); const left=(tPause!=null?tPause:tEnd-Date.now())/1000;
  if(left<=0&&!tBeeped){tBeeped=true;beep();}
  if(left<-20){stopTimer();return;}
  el.hidden=false; el.classList.toggle("over",left<=0);
  const stato=tPause!=null?"In pausa":left>0?"Recupero":"Prossima serie";
  if(tMini){
    el.classList.remove("full");
    el.innerHTML=`<div class="tb"><div class="tt">${left>0?fmtTime(left):"Via!"}</div><div class="tl">${stato} · ${esc(tName)}</div>
    <button data-act="tmax">Ingrandisci</button><button data-act="tskip">${left>0?"Salta":"Ok"}</button>
    <div class="bar" style="width:${Math.max(0,Math.min(100,left/tTotal*100))}%"></div></div>`;
    return;
  }
  if(!el.classList.contains("full")||!el.querySelector(".ring")){
    el.classList.add("full");
    el.innerHTML=`<div class="tcard" role="dialog" aria-label="Recupero"><div class="tname"></div>
      <div class="ring"><svg viewBox="0 0 240 240" aria-hidden="true"><circle class="rbg" cx="120" cy="120" r="104"/><circle class="rfg" cx="120" cy="120" r="104" stroke-dasharray="${RC.toFixed(2)}"/></svg>
      <div class="rin"><div class="rtime" aria-live="off"></div><button class="rskip" data-act="tskip">Salta</button></div></div>
      <div class="rbtns"><button class="rb" data-act="tpause">Pausa</button><button class="rb" data-act="tadd">+15 s</button></div>
      <button class="rmin" data-act="tmini">Riduci e continua a segnare</button></div>`;
  }
  const frac=left>0?Math.max(0,Math.min(1,left/tTotal)):0;
  el.querySelector(".tname").innerHTML=`${stato}<b>${esc(tName)}</b>`;
  el.querySelector(".rtime").textContent=left>0?fmtTime(left):"Via!";
  el.querySelector(".rfg").style.strokeDashoffset=(RC*frac).toFixed(2);
  el.querySelector(".rskip").textContent=left>0?"Salta":"Ok";
  const pb=el.querySelector('[data-act="tpause"]'); pb.hidden=!(left>0); pb.textContent=tPause!=null?"Riprendi":"Pausa";
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]"); if(!b) return;
  if(b.dataset.act==="tmini"){tMini=true;tick();} else if(b.dataset.act==="tmax"){tMini=false;tick();}});
async function keepAwake(){try{if(navigator.wakeLock&&!wake){wake=await navigator.wakeLock.request("screen");wake.addEventListener("release",()=>wake=null);}}catch(e){}}

/* ---------- Toast ---------- */
let toastT=null;
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600);}

/* ---------- Eventi ---------- */
document.addEventListener("click",e=>{
  ensureAudio();
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act;
  if(a==="closepick"&&b.classList.contains("sheet")&&e.target!==b) return;
  const s=state.schede.find(x=>x.id===editId);
  switch(a){
    case "tab": go(b.dataset.v); break;
    case "gallow": askGarmin(); break;
    case "runadd": runPick=null; runForm=true; render(); setTimeout(()=>{const k=document.getElementById("rf-km");k&&k.focus();},50); break;
    case "runcancel": runPick=null; runForm=false; render(); break;
    case "runsave": saveRunForm(); break;
    case "rundel": {const id=b.dataset.id; if(confirmDel===id){const r=(state.runs||[]).find(x=>x.id===id); state.runs=(state.runs||[]).filter(x=>x.id!==id); if(r&&r.g){state.runsHidden=state.runsHidden||[];state.runsHidden.push(r.g);} saveRuns(); confirmDel=null; toast("Corsa eliminata"); render();} else {confirmDel=id; render();} break;}
    case "grefresh": if(MCP){garmin.refreshing=true;render();MCP.invalidate(HA,"ha_get_state").catch(()=>{});setTimeout(()=>{garmin.refreshing=false;softRender();},4000);} break;
    case "start": sessId=b.dataset.id; draft={}; keepAwake(); go("sessione"); break;
    case "log": {
      const k=b.dataset.k, inW=document.querySelector(`[data-d="${k}"][data-f="w"]`), inR=document.querySelector(`[data-d="${k}"][data-f="r"]`);
      const w=inW?num(inW.value):0, r=Math.round(num(inR.value));
      if(!(w>=0)||!(r>0)){toast("Inserisci peso e ripetizioni");return;}
      if(w>=400){toast("Il peso deve essere inferiore a 400 kg");inW&&inW.focus();return;}
      const t=Date.now(), mk=monthKey(t);
      (state.months[mk]||(state.months[mk]=[])).push({t,ex:b.dataset.ex,w,r,s:sessId});
      delete draft[k]; saveMonth(mk); snapGarmin(); render();
      if(!SENZA_TIMER&&+b.dataset.rec>0) startTimer(+b.dataset.rec,exInfo(b.dataset.ex).n,b.dataset.ex+"@"+t); break;}
    case "undo": {
      const t=+b.dataset.t, mk=monthKey(t);
      state.months[mk]=(state.months[mk]||[]).filter(x=>!(x.t===t&&x.ex===b.dataset.ex));
      saveMonth(mk);
      const stop=(tInt||tPause!=null)&&tFrom===b.dataset.ex+"@"+t; if(stop) stopTimer();
      render(); toast(stop?"Serie annullata, recupero fermato":"Serie annullata"); break;}
    case "extra": draft[b.dataset.ex+":extra"]=(draft[b.dataset.ex+":extra"]||0)+1; render(); break;
    case "timer": startTimer(+b.dataset.rec,b.dataset.name); break;
    case "tpause":
      if(tPause!=null){tEnd=Date.now()+tPause;tPause=null;clearInterval(tInt);tInt=setInterval(tick,250);}
      else{tPause=Math.max(0,tEnd-Date.now());clearInterval(tInt);tInt=null;}
      tick(); break;
    case "tadd": if(tPause!=null){tPause+=15000;tTotal+=15;tick();break;} tEnd=Math.max(tEnd,Date.now())+15000; tTotal+=15; tBeeped=false; tick(); break;
    case "tskip": stopTimer(); break;
    case "finish": {
      const today=dayKey(Date.now()); const ss=allSets().filter(x=>x.s===sessId&&dayKey(x.t)===today);
      stopTimer(); try{wake&&wake.release();}catch(err){}
      toast(ss.length?`Allenamento salvato: ${ss.length} serie, ${fmt(Math.round(ss.reduce((a,x)=>a+x.w*x.r,0)))} kg di volume`:"Nessuna serie segnata oggi");
      go("oggi"); break;}
    case "edit": editId=b.dataset.id; go("modifica"); break;
    case "new": {const id=uid(); state.schede.push({id,nome:"Scheda "+String.fromCharCode(65+state.schede.length%26),esercizi:[]}); saveConfig(); editId=id; go("modifica"); break;}
    case "mv": {const i=+b.dataset.i,d=+b.dataset.d,arr=s.esercizi;[arr[i],arr[i+d]]=[arr[i+d],arr[i]];saveConfig();render();break;}
    case "rm": s.esercizi.splice(+b.dataset.i,1); saveConfig(); render(); break;
    case "del": if(confirmDel===s.id){state.schede=state.schede.filter(x=>x.id!==s.id);saveConfig();toast("Scheda eliminata");go("schede");}else{confirmDel=s.id;render();} break;
    case "pick": pick={open:true,q:"",g:"Tutti"}; renderSheet(); break;
    case "closepick": pick.open=false; renderSheet(); break;
    case "pg": pick.g=b.dataset.g; renderSheet(); break;
    case "add": s.esercizi.push({ex:b.dataset.ex,serie:3,rMin:8,rMax:12,rec:90}); saveConfig(); pick.open=false; renderSheet(); render(); toast(exInfo(b.dataset.ex).n+" aggiunto"); break;
    case "addcustom": {
      const n=document.getElementById("cn").value.trim(); if(!n){toast("Scrivi il nome dell'esercizio");return;}
      const id="c-"+slug(n)+"-"+uid().slice(0,3);
      (state.custom||(state.custom=[])).push({id,n,g:document.getElementById("cg").value,e:document.getElementById("ce").value});
      s.esercizi.push({ex:id,serie:3,rMin:8,rMax:12,rec:90}); saveConfig(); pick.open=false; renderSheet(); render(); toast(n+" aggiunto"); break;}
  }
});
let saveT=null;
const debSave=()=>{clearTimeout(saveT);saveT=setTimeout(saveConfig,600);};
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.d){const k=t.dataset.d;(draft[k]||(draft[k]={}))[t.dataset.f]=t.value;
    if(t.dataset.f==="w")t.classList.toggle("bad",num(t.value)>=400);return;}
  if(t.id==="pq"){pick.q=t.value;const pos=t.selectionStart;renderSheet();const n=document.getElementById("pq");n.focus();try{n.setSelectionRange(pos,pos);}catch(err){}return;}
  const s=state.schede.find(x=>x.id===editId); if(!s) return;
  if(t.id==="sn"){s.nome=t.value.trim()||"Senza nome";debSave();return;}
  if(t.dataset.ed!=null&&t.tagName==="INPUT"){const e2=s.esercizi[+t.dataset.ed],v=parseInt(t.value,10);if(v>0){e2[t.dataset.f]=Math.min(v,t.dataset.f==="serie"?10:100);debSave();}}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="pe"){progEx=t.value;render();return;}
  const s=state.schede.find(x=>x.id===editId); if(!s) return;
  if(t.dataset.ed!=null){const e2=s.esercizi[+t.dataset.ed];
    if(t.tagName==="SELECT") e2.rec=+t.value;
    if(e2.rMin>e2.rMax){e2.rMax=e2.rMin;}
    saveConfig(); if(t.tagName!=="SELECT") render();}
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&view==="sessione")keepAwake();});

render(); renderSync(); initCloud(); initGarmin();
